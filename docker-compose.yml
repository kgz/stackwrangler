# S3 (SeaweedFS) + IAM/Lambda (LocalEmu). Console is a client of both.
services:
  s3:
    image: chrislusf/seaweedfs:4.48
    # volume.max=0 (mini default) auto-sizes from free disk; on a nearly-full
    # host that becomes 0 free volumes → PutObject InternalError. Pin a floor.
    command: mini -dir=/data -volume.max=8
    environment:
      AWS_ACCESS_KEY_ID: ${STACKWRANGLER_ACCESS_KEY:-${AWSBOX_ACCESS_KEY:-stackwrangler}}
      AWS_SECRET_ACCESS_KEY: ${STACKWRANGLER_SECRET_KEY:-${AWSBOX_SECRET_KEY:-stackwranglerstackwrangler}}
    ports:
      - "127.0.0.1:${STACKWRANGLER_S3_HOST_PORT:-${AWSBOX_S3_HOST_PORT:-8333}}:8333"
    volumes:
      # --test uses seaweed-data; --dev uses seaweed-data-dev (docs/dev-mode.md).
      - ${STACKWRANGLER_SEAWEED_VOLUME:-seaweed-data}:/data
    healthcheck:
      # any HTTP response (incl. 403) means S3 is listening
      test: ["CMD-SHELL", "wget -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/'"]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 8s

  # Free LocalStack alternative — IAM_ENFORCEMENT + Docker-backed Lambda
  # Digest pinned for localemu-patches/ mounts (#196 review); bump with IMAGE_DIGEST.
  localstack:
    image: localemu/localemu@sha256:86a84bf21e3c0cf2cb695bdd890bce642e8e3d852c41f46d7aa8123551cee10b
    user: root
    # NET_ADMIN: transfer-connector-smoke drops the default route to prove
    # paramiko works with no public egress (#315). Compose/RFC1918 stays up.
    cap_add:
      - NET_ADMIN
    environment:
      SERVICES: iam,sts,s3,s3control,lambda,logs,apigateway,apigatewayv2,route53,acm,ecs,ec2,ecr,elbv2,codedeploy,cloudformation,transfer,rds,sqs,sns,events,scheduler,dynamodb,dynamodbstreams,stepfunctions,secretsmanager,kms,kinesis,ssm,cloudwatch,cloudtrail,organizations,backup,batch,application-autoscaling,autoscaling,elasticbeanstalk,apprunner,dax,wafv2,waf,network-firewall,fms
      # Host docker daemon pulls this address (published below). #211
      AWSBOX_ECR_REGISTRY: 127.0.0.1:${STACKWRANGLER_ECR_HOST_PORT:-${AWSBOX_ECR_HOST_PORT:-5000}}
      # ECS task-role credentials for host-network tasks (start.d/05-ecs-creds-port.py)
      AWSBOX_ECS_CREDS_PORT: ${STACKWRANGLER_ECS_CREDS_PORT:-${AWSBOX_ECS_CREDS_PORT:-4571}}
      # Transfer Family inbound SFTP (start.d/20-transfer-sftp.py) — SSH keys, not password.
      AWSBOX_TRANSFER_SFTP_PORT: ${STACKWRANGLER_TRANSFER_SFTP_PORT:-${AWSBOX_TRANSFER_SFTP_PORT:-2222}}
      AWSBOX_SFTP_HOST_PORT: ${STACKWRANGLER_SFTP_HOST_PORT:-${AWSBOX_SFTP_HOST_PORT:-2222}}
      AWSBOX_TRANSFER_SFTP_HOST: ${STACKWRANGLER_TRANSFER_SFTP_HOST:-${AWSBOX_TRANSFER_SFTP_HOST:-127.0.0.1}}
      # Resolver subprocess reads this; the gateway process does not use AWS_* creds.
      R53_RESOLVER_SECRET: ${STACKWRANGLER_SECRET_KEY:-${AWSBOX_SECRET_KEY:-stackwranglerstackwrangler}}
      IAM_ENFORCEMENT: "1"
      EC2_VM_MANAGER: docker
      # Real Postgres/MySQL containers via Docker (not moto-only).
      # Aurora MySQL writer/reader + managed secret: init/start.d/20-rds-mysql.py
      RDS_DOCKER_BACKEND: "1"
      # Expire messages past MessageRetentionPeriod (AWS default behaviour; off in upstream LocalEmu).
      SQS_ENABLE_MESSAGE_RETENTION_PERIOD: "1"
      DEBUG: "0"
      # test (default): 0. --dev sets STACKWRANGLER_PERSISTENCE=1 + docker-compose.dev.yml mount.
      PERSISTENCE: "${STACKWRANGLER_PERSISTENCE:-0}"
      GATEWAY_LISTEN: 0.0.0.0:4566
      AWS_DEFAULT_REGION: ${STACKWRANGLER_REGION:-${AWSBOX_REGION:-us-east-1}}
      # Key→account map (listed keys are root there; per-key wins); default account in ARNs.
      # docs/multi-account.md · docs/custom-ids.md
      AWSBOX_ACCOUNT_ID: ${STACKWRANGLER_ACCOUNT_ID:-${AWSBOX_ACCOUNT_ID:-}}
      AWSBOX_ACCOUNT_IDS: ${STACKWRANGLER_ACCOUNT_IDS:-${AWSBOX_ACCOUNT_IDS:-}}
      # Naming another account's bucket must not read it.
      MOTO_S3_ALLOW_CROSSACCOUNT_ACCESS: "false"
      ROOT_ACCESS_KEYS: ${STACKWRANGLER_ACCESS_KEY:-${AWSBOX_ACCESS_KEY:-stackwrangler}},AKIAIOSFODNN7EXAMPLE
      DISABLE_CORS_CHECKS: "1"
      EXTRA_CORS_ALLOWED_ORIGINS: "*"
      # VPC-only Lambda host maps (docs/lambda-vpc.md). start.d injects into
      # docker run when the function has VpcConfig; non-VPC must not resolve them (#187).
      STACKWRANGLER_LAMBDA_DOCKER_FLAGS: ${STACKWRANGLER_LAMBDA_DOCKER_FLAGS:-${AWSBOX_LAMBDA_DOCKER_FLAGS:---add-host=host.docker.internal:host-gateway}}
      AWSBOX_LAMBDA_DOCKER_FLAGS: ${STACKWRANGLER_LAMBDA_DOCKER_FLAGS:-${AWSBOX_LAMBDA_DOCKER_FLAGS:---add-host=host.docker.internal:host-gateway}}
      # Leave LocalEmu's global flags empty — SQS QueueUrl / VPCE DNS patches add their own.
      LAMBDA_DOCKER_FLAGS: ""
      # Shorten STS AssumeRole sessions for ESM credential-refresh smoke (#475).
      # Unset in normal use (LocalEmu default 3600s). Example: 120
      AWSBOX_STS_ASSUME_ROLE_DURATION: ${STACKWRANGLER_STS_ASSUME_ROLE_DURATION:-${AWSBOX_STS_ASSUME_ROLE_DURATION:-}}
    ports:
      - "127.0.0.1:${STACKWRANGLER_LOCALEMU_HOST_PORT:-${AWSBOX_LOCALEMU_HOST_PORT:-4566}}:4566"
      - "127.0.0.1:${STACKWRANGLER_ECS_CREDS_PORT:-${AWSBOX_ECS_CREDS_PORT:-4571}}:${STACKWRANGLER_ECS_CREDS_PORT:-${AWSBOX_ECS_CREDS_PORT:-4571}}"
      # Native Transfer SFTP (SSH public keys). See docs/transfer.md.
      - "127.0.0.1:${STACKWRANGLER_SFTP_HOST_PORT:-${AWSBOX_SFTP_HOST_PORT:-2222}}:${STACKWRANGLER_TRANSFER_SFTP_PORT:-${AWSBOX_TRANSFER_SFTP_PORT:-2222}}"
    extra_hosts:
      # Bridge-mode task ports are published on the Docker host. Health checks
      # and the loopback NLB forwarder dial them from inside LocalEmu (#207).
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Linux docker CLI inside LocalEmu for VPC bridge create + iptables helpers (#154).
      # Default /usr/bin/docker. Override STACKWRANGLER_DOCKER_CLI if the host path differs.
      # Must be a Linux ELF binary — Darwin/Windows Docker Desktop CLIs will not run here.
      - ${STACKWRANGLER_DOCKER_CLI:-/usr/bin/docker}:/usr/bin/docker:ro
      # Prowler compat (#196): S3 Control reads + EC2/IAM stubs.
      # start.d also routes REST custom domains (#191) and Deny→403 (#190).
      # Multi-account (#213): localemu-patches/init/start.d/21-multi-account.py
      # Custom resource ids (#214): localemu-patches/init/start.d/20-custom-ids.py
      - ./localemu-patches/s3control_provider.py:/opt/code/localemu/src/localemu/services/s3control/provider.py:ro
      # #712: LocalEmu S3 spool under /var/lib/localemu/s3 when PERSISTENCE=1;
      # restore object bodies after S3 provider starts; mkdir restored bucket dirs.
      - ./localemu-patches/s3_storage_ephemeral.py:/opt/code/localemu/src/localemu/services/s3/storage/ephemeral.py:ro
      - ./localemu-patches/state_persistence.py:/opt/code/localemu/src/localemu/state/persistence.py:ro
      # Persistence recreate: UpdateFunctionCode / delete without a running version (#713).
      - ./localemu-patches/lambda_service.py:/opt/code/localemu/src/localemu/services/lambda_/invocation/lambda_service.py:ro
      - ./localemu-patches/init/boot.d:/etc/localemu/init/boot.d:ro
      - ./localemu-patches/init/start.d:/etc/localemu/init/start.d:ro
      # RDS engine version → pinned Docker tags (#704)
      - ./localemu-patches/rds_engine_mapping.py:/opt/code/localemu/src/localemu/services/rds/docker/engine_mapping.py:ro
      # SFTP client for Transfer connectors + inbound SFTP (#315) — no pip/PyPI at boot.
      - ./localemu-patches/wheels:/opt/awsbox/wheels:ro
      - ./localemu-patches/paramiko_vendor.py:/opt/awsbox/paramiko_vendor.py:ro
      # Local OIDC test issuer JWKS (#209). Key+JWKS generated by bin/oidc-mint.py (gitignored).
      - ./localemu-patches/oidc:/opt/awsbox/oidc:ro
      # ECS taskdef fidelity (#201): secrets valueFrom, host ports, failed-start status
      # ECR image pull authz (#211) lives in the same task manager mount
      - ./localemu-patches/ecs_task_manager.py:/opt/code/localemu/src/localemu/services/ecs/docker/task_manager.py:ro
      - ./localemu-patches/ecs_provider.py:/opt/code/localemu/src/localemu/services/ecs/provider.py:ro
      # ECS on EC2 (#207): container instances, desiredCount, TG registration, CodeDeploy.
      # Loopback NLB forwarder lives in this module: #203's listener dials the EC2 VPC IP,
      # which does not publish bridge host ports (#247).
      - ./localemu-patches/ecs_ec2_services.py:/opt/code/localemu/src/localemu/services/ecs/ec2_services.py:ro
      # DynamoDB index ARNs (#296): Query/Scan IndexName -> table/<t>/index/<i>
      - ./localemu-patches/iam_arn_builder.py:/opt/code/localemu/src/localemu/services/iam_enforcement/arn_builder.py:ro
      # DynamoDB index aws:ResourceTag (#307): index ARNs inherit table tags
      - ./localemu-patches/resource_tag_loader.py:/opt/code/localemu/src/localemu/services/iam_enforcement/resource_tag_loader.py:ro
      # DynamoDB Transact*/Batch* per-item/table IAM (#306)
      - ./localemu-patches/service_action_map.py:/opt/code/localemu/src/localemu/services/iam_enforcement/service_action_map.py:ro
      - ./localemu-patches/iam_enforcer.py:/opt/code/localemu/src/localemu/services/iam_enforcement/enforcer.py:ro
      - ./localemu-patches/api_call_log.py:/opt/code/localemu/src/localemu/services/iam_enforcement/api_call_log.py:ro
      # Resource policies (#193): Secrets Manager loader + KMS key-policy rules
      - ./localemu-patches/resource_policies.py:/opt/code/localemu/src/localemu/services/iam_enforcement/resource_policies.py:ro
      # CFN lifecycle (#212): failed-create rollback, delete-stack cleanup, honest status
      - ./localemu-patches/cfn_v2_provider.py:/opt/code/localemu/src/localemu/services/cloudformation/v2/provider.py:ro
      - ./localemu-patches/cfn_change_set_model_executor.py:/opt/code/localemu/src/localemu/services/cloudformation/engine/v2/change_set_model_executor.py:ro
      # CFN caller / RoleARN IAM for resource ops (#524)
      - ./localemu-patches/cfn_deploy_credentials.py:/opt/code/localemu/src/localemu/services/cloudformation/cfn_deploy_credentials.py:ro
      # VPC route tables (#204): private subnets, peering, NAT
      - ./localemu-patches/vpc_routing.py:/opt/code/localemu/src/localemu/services/ec2/docker/vpc_routing.py:ro
      # #289: single-source Dockerfiles for ec2-base + awsbox-rt (ensure_base_image / _ensure_rt_image).
      - ./localemu-patches/base_image.py:/opt/code/localemu/src/localemu/services/ec2/docker/base_image.py:ro
      - ./docker/Dockerfile.ec2-base:/opt/awsbox/docker/Dockerfile.ec2-base:ro
      - ./docker/Dockerfile.awsbox-rt:/opt/awsbox/docker/Dockerfile.awsbox-rt:ro
      # Security groups (#205): ECS awsvpc + RDS + prefix lists on top of EC2 sg_iptables
      - ./localemu-patches/sg_enforcement.py:/opt/code/localemu/src/localemu/services/ec2/docker/sg_enforcement.py:ro
      # Interface VPCE private DNS (#258): resolver + proxy forward to gateway IP
      - ./localemu-patches/vpce_private_dns.py:/opt/code/localemu/src/localemu/services/ec2/docker/vpce_private_dns.py:ro
      - ./localemu-patches/vpc_endpoint.py:/opt/code/localemu/src/localemu/services/ec2/docker/vpc_endpoint.py:ro
      # ELBv2 data plane (#203) + NLB DNS for VPC_LINK (#267)
      - ./localemu-patches/elbv2_listener_router.py:/opt/code/localemu/src/localemu/services/elbv2/listener_router.py:ro
      - ./localemu-patches/elbv2_provider.py:/opt/code/localemu/src/localemu/services/elbv2/provider.py:ro
      - ./.awsbox:/var/lib/awsbox
      # Shared DNS codec/servers for VPCE + private zones (#206)
      - ./localemu-patches/dns_common.py:/opt/awsbox/dns/awsbox_dns_common.py:ro
      # Shared ESM/SQS request + function lookup helpers (#266 / #363)
      - ./localemu-patches/esm_common.py:/opt/awsbox/esm/awsbox_esm_common.py:ro
      # Shared ECR BatchGetImage + local-registry rewrite (#211 / #219)
      - ./localemu-patches/ecr_pull.py:/opt/awsbox/ecr/awsbox_ecr_pull.py:ro
      # Gateway HTTPS CA + leaf for ECS/Lambda/EC2 AWS_ENDPOINT_URL (#687/#696)
      - ./localemu-patches/gateway_tls.py:/opt/awsbox/tls/awsbox_gateway_tls.py:ro

      # Private hosted zones (#206): answered by the same process as VPCE DNS (vpce_private_dns serve)
      - ./localemu-patches/r53_private_resolver.py:/opt/code/localemu/src/localemu/services/route53/private_resolver.py:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4566/ | grep -qE '^[12345]'",
        ]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 20s

  # Optional password SFTP target for outbound connector tests / legacy probes.
  # Inbound Transfer uses LocalEmu native SFTP (SSH keys) on STACKWRANGLER_SFTP_HOST_PORT.
  # Opt in: docker compose --profile legacy-sftp up -d sftp
  sftp:
    profiles: ["legacy-sftp"]
    image: atmoz/sftp:alpine
    ports:
      - "127.0.0.1:${STACKWRANGLER_LEGACY_SFTP_HOST_PORT:-${AWSBOX_LEGACY_SFTP_HOST_PORT:-2223}}:22"
    command: stackwrangler:stackwranglerpass:1001:1001:upload

  # Transparent AWS DNS + TLS redirect for Serverless v4 (and similar SDK v2 paths).
  # Opt in: docker compose --profile aws-redirect up -d aws-redirect
  # Clients: --dns <aws-redirect IP>, NODE_EXTRA_CA_CERTS=.awsbox/aws-redirect/ca.crt
  # See tools/aws-endpoint-redirect/ and docs/serverless-stackwrangler.md (#464).
  aws-redirect:
    profiles: ["aws-redirect"]
    build:
      context: ./tools/aws-endpoint-redirect
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      LOCALEMU_URL: http://localstack:4566
      AWS_REDIRECT_CERT_DIR: /certs
    volumes:
      - ./.awsbox/aws-redirect:/certs
    # DNS + TLS stay on the compose network (sls wrapper uses --dns). No host publish.
    # Ready = AWS DNS → self AND TLS :443 accepts (not DNS alone; TLS can die while DNS stays).
    healthcheck:
      test: ["CMD", "/opt/aws-redirect/healthcheck.sh"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Docker distribution registry. Push/pull 127.0.0.1:5000/<repo>:<tag>.
  # ECS/Lambda amazonaws.com ECR URIs are rewritten to this address (#211).
  ecr-registry:
    image: registry:2
    depends_on:
      localstack:
        condition: service_healthy
    networks:
      - default
      - ecr-host
    ports:
      - "127.0.0.1:${STACKWRANGLER_ECR_HOST_PORT:-${AWSBOX_ECR_HOST_PORT:-5000}}:5000"
    volumes:
      - ./localemu-patches/ecr-registry.yml:/etc/docker/registry/config.yml:ro

  # TLS :443 on a fixed bridge IP so docker login/push of repositoryUri works
  # without retag and without binding host :443 (#218).
  ecr-hostname:
    build:
      context: ./tools
      dockerfile: ecr-hostname-proxy/Dockerfile
    depends_on:
      - ecr-registry
    environment:
      ECR_REGISTRY_URL: http://ecr-registry:5000
      ECR_HOSTNAME_CERT_DIR: /certs
      AWS_REDIRECT_CERT_DIR: /certs
      LOCALEMU_URL: http://ecr-registry:5000

    volumes:
      - ./.awsbox/ecr-hostname:/certs
    networks:
      ecr-host:
        ipv4_address: ${STACKWRANGLER_ECR_HOSTNAME_IP:-${AWSBOX_ECR_HOSTNAME_IP:-172.31.218.10}}
    healthcheck:
      test: ["CMD", "/opt/ecr-hostname/healthcheck.sh"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 8s

volumes:
  seaweed-data:
  seaweed-data-dev:

networks:
  ecr-host:
    driver: bridge
    ipam:
      config:
        - subnet: ${STACKWRANGLER_ECR_HOSTNAME_SUBNET:-${AWSBOX_ECR_HOSTNAME_SUBNET:-172.31.218.0/24}}
