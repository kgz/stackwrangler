# S3 (SeaweedFS) + IAM/Lambda (LocalEmu). Console is a client of both.
services:
  s3:
    image: chrislusf/seaweedfs:4.48
    command: mini -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: ${AWSBOX_ACCESS_KEY:-awsbox}
      AWS_SECRET_ACCESS_KEY: ${AWSBOX_SECRET_KEY:-awsboxawsbox}
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweed-data:/data
    healthcheck:
      # any HTTP response (incl. 403) means S3 is listening
      test: ["CMD-SHELL", "wget -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/'"]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 8s

  # Free LocalStack alternative — IAM_ENFORCEMENT + Docker-backed Lambda
  localstack:
    image: localemu/localemu:latest
    user: root
    environment:
      SERVICES: iam,sts,s3,lambda,logs,apigateway,apigatewayv2,ecs,ec2,cloudformation,transfer,rds,sqs,sns,events,dynamodb,dynamodbstreams,stepfunctions,secretsmanager,kms,kinesis
      IAM_ENFORCEMENT: "1"
      EC2_VM_MANAGER: docker
      # Real Postgres/MySQL containers via Docker (not moto-only)
      RDS_DOCKER_BACKEND: "1"
      DEBUG: "0"
      PERSISTENCE: "0"
      GATEWAY_LISTEN: 0.0.0.0:4566
      AWS_DEFAULT_REGION: ${AWSBOX_REGION:-us-east-1}
      ROOT_ACCESS_KEYS: ${AWSBOX_ACCESS_KEY:-awsbox},AKIAIOSFODNN7EXAMPLE
      DISABLE_CORS_CHECKS: "1"
      EXTRA_CORS_ALLOWED_ORIGINS: "*"
      # Extra `docker run` flags for Lambda containers, e.g. map internal hostnames
      # to the host: --add-host=internal-nlb.example:host-gateway (docs/lambda-vpc.md)
      LAMBDA_DOCKER_FLAGS: ${AWSBOX_LAMBDA_DOCKER_FLAGS:---add-host=host.docker.internal:host-gateway}
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4566/ | grep -qE '^[12345]'",
        ]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 20s

  # Real SFTP listen — LocalEmu Transfer is control-plane only today.
  # Smoke bridges uploads into LocalEmu S3 (see docs/transfer.md).
  sftp:
    image: atmoz/sftp:alpine
    ports:
      - "127.0.0.1:2222:22"
    command: awsbox:awsboxpass:1001:1001:upload

volumes:
  seaweed-data:
