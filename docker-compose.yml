# S3 (SeaweedFS) + IAM (LocalEmu with policy enforcement). Console is a client of both.
services:
  s3:
    image: chrislusf/seaweedfs:4.48
    command: mini -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: ${AWSBOX_ACCESS_KEY:-awsbox}
      AWS_SECRET_ACCESS_KEY: ${AWSBOX_SECRET_KEY:-awsboxawsbox}
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweed-data:/data
    healthcheck:
      # any HTTP response (incl. 403) means S3 is listening
      test: ["CMD-SHELL", "wget -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/'"]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 8s

  # Free LocalStack alternative — IAM_ENFORCEMENT returns real AccessDenied
  localstack:
    image: localemu/localemu:latest
    environment:
      SERVICES: iam,sts,s3
      IAM_ENFORCEMENT: "1"
      DEBUG: "0"
      PERSISTENCE: "0"
      GATEWAY_LISTEN: 0.0.0.0:4566
      AWS_DEFAULT_REGION: ${AWSBOX_REGION:-us-east-1}
      # treat awsbox keys as root so admin CLI/console bypass enforcement
      ROOT_ACCESS_KEYS: ${AWSBOX_ACCESS_KEY:-awsbox},AKIAIOSFODNN7EXAMPLE
      # belt-and-suspenders; console still proxies via Vite /aws-iam
      DISABLE_CORS_CHECKS: "1"
      EXTRA_CORS_ALLOWED_ORIGINS: "*"
    ports:
      - "127.0.0.1:4566:4566"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4566/ | grep -qE '^[12345]'",
        ]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 20s

volumes:
  seaweed-data:
