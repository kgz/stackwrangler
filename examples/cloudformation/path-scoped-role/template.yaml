AWSTemplateFormatVersion: "2010-09-09"
Description: Path + PermissionsBoundary IAM role for CFN path-scoped grant smoke (#679)

Parameters:
  RoleName:
    Type: String
  RolePath:
    Type: String
    Default: /app/dev/
  PermissionsBoundaryArn:
    Type: String

Resources:
  AppRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Path: !Ref RolePath
      PermissionsBoundary: !Ref PermissionsBoundaryArn
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: smoke
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sts:GetCallerIdentity
                Resource: "*"
