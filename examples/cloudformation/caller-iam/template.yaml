AWSTemplateFormatVersion: "2010-09-09"
Description: Minimal resources for CFN caller-IAM smoke (#524)

Parameters:
  RoleName:
    Type: String
  QueueName:
    Type: String
  LogGroupName:
    Type: String

Resources:
  DeployProbeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole

  DeployProbeQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Ref QueueName

  DeployProbeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Ref LogGroupName
      RetentionInDays: 1
