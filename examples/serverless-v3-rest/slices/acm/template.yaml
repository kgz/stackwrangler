# ACM certificate + API custom domain + ALB HTTPS listener shape (#74).
# Smoke: ./smokes/security/acm-smoke.sh applies the same shape via CLI.
AWSTemplateFormatVersion: "2010-09-09"
Description: awsbox ACM slice — DNS-validated cert for api.example.test

Parameters:
  DomainName:
    Type: String
    Default: api.example.test
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  RestApiId:
    Type: String

Resources:
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS

  ApiDomain:
    Type: AWS::ApiGateway::DomainName
    Properties:
      DomainName: !Ref DomainName
      RegionalCertificateArn: !Ref Certificate
      EndpointConfiguration:
        Types:
          - REGIONAL

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub acm-tg-${AWS::StackName}
      Protocol: HTTP
      Port: 80
      VpcId: !Ref VpcId
      TargetType: ip

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub acm-alb-${AWS::StackName}
      Type: application
      Scheme: internet-facing
      Subnets: !Ref SubnetIds

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTPS
      Port: 443
      Certificates:
        - CertificateArn: !Ref Certificate
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

Outputs:
  CertificateArn:
    Value: !Ref Certificate
  DomainName:
    Value: !Ref DomainName
