AWSTemplateFormatVersion: "2010-09-09"
Description: awsbox scheduled EventBridge rule to Lambda (Serverless v3 schedule event shape)

Parameters:
  FunctionName:
    Type: String
  RuleName:
    Type: String
  CodeBucket:
    Type: String
  CodeKey:
    Type: String
    Default: function.zip
  ScheduleExpression:
    Type: String
    Default: rate(1 minute)
  RuleState:
    Type: String
    Default: ENABLED
    AllowedValues: [ENABLED, DISABLED]
  GrantInvoke:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]

Conditions:
  CreatePermission: !Equals [!Ref GrantInvoke, "true"]

Resources:
  SessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${FunctionName}-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub "${FunctionName}-sweep"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Scan
                  - dynamodb:DeleteItem
                Resource: !GetAtt SessionsTable.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"

  CleanupFunction:
    Type: AWS::Lambda::Function
    DependsOn: LambdaRole
    Properties:
      FunctionName: !Ref FunctionName
      Runtime: nodejs18.x
      Handler: index.handler
      Timeout: 30
      Role: !GetAtt LambdaRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref SessionsTable
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey

  CleanupScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Ref RuleName
      ScheduleExpression: !Ref ScheduleExpression
      State: !Ref RuleState
      Targets:
        - Id: cleanup
          Arn: !GetAtt CleanupFunction.Arn

  CleanupInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: CreatePermission
    Properties:
      FunctionName: !Ref CleanupFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt CleanupScheduleRule.Arn

Outputs:
  TableName:
    Value: !Ref SessionsTable
