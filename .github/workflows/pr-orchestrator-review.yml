# Soft merge gate: PR must be marked reviewed by the ticket-batch orchestrator.
# Hard branch-protection "required reviews" needs GitHub Pro (or a public repo) on
# private repos — enable requiring this check when that is available.
# See docs/pr-review-gate.md.
name: orchestrator-review

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  reviewed:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Require orchestrator-reviewed or non-author approval
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;
            const author = context.payload.pull_request.user.login;

            const pr = await github.rest.pulls.get({ owner, repo, pull_number });
            const labels = (pr.data.labels || []).map((l) => l.name);
            if (labels.includes('orchestrator-reviewed')) {
              core.info('Label orchestrator-reviewed present');
              return;
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number,
              per_page: 100,
            });
            // Latest review per user wins
            const latest = new Map();
            for (const r of reviews) {
              if (!r.user) continue;
              latest.set(r.user.login, r);
            }
            for (const r of latest.values()) {
              if (r.state === 'APPROVED' && r.user.login !== author) {
                core.info(`Approved by ${r.user.login}`);
                return;
              }
            }

            core.setFailed(
              'PR is not merge-ready: add label orchestrator-reviewed ' +
                '(ticket-batch orchestrator after must-fix: none) ' +
                'or an APPROVED review from someone other than the PR author. ' +
                'See docs/pr-review-gate.md'
            );
