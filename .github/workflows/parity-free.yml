# Free local dual-target parity on PRs / main (#675).
# LocalEmu only — no real AWS. Failures print check id + title via bin/parity.
name: parity-free

on:
  push:
    branches: [main]
  pull_request:

jobs:
  free-ci:
    name: free-ci local parity
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install AWS CLI
        run: |
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp
          sudo /tmp/aws/install --update

      - name: Install host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zip python3-yaml jq

      - name: Start LocalEmu stack
        run: |
          chmod +x bin/stackwrangler bin/awsbox bin/parity
          ./bin/stackwrangler up --force

      - name: Free-ci local parity
        run: ./bin/parity run --suite free-ci --target local

      - name: Tear down
        if: always()
        run: ./bin/stackwrangler down || true
