server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Browser → same-origin; LocalEmu CORS blocks the console origin.
    # Upstream is the compose service name on the release network.
    location /aws-iam/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://localstack:4566/;
    }

    location /aws-iam {
        return 301 /aws-iam/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
