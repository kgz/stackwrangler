<!doctype html>
<html lang="en" data-asset-base="../assets">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Users — IAM</title>
  <link rel="stylesheet" href="../assets/fonts.css" />
  <link rel="stylesheet" href="../assets/console.css" />
</head>
<body data-page="iam-users-empty" data-nav="iam-users" data-service="iam" data-title="Users" data-crumb="Users">
  <div id="aws-chrome"></div>
  <div class="aws-shell" id="aws-shell" data-od-id="shell">
    <main class="aws-main" id="content" data-od-id="main-content">

      <h1 class="aws-h1" data-od-id="page-title">Users</h1>
      <p class="aws-desc">An IAM user is an identity with long-term credentials used to interact with awsbox.</p>
      <section class="aws-card" data-od-id="content-card">
        <div class="aws-card-body">
          <div class="aws-toolbar" data-od-id="action-toolbar">
            <button type="button" class="btn-icon" aria-label="Refresh" title="To implement" disabled aria-disabled="true">↻</button>
            <div class="spacer"></div>
            <button type="button" class="btn btn-primary" data-od-id="btn-create-user" disabled aria-disabled="true" title="To implement">Create user</button>
          </div>
          <div class="aws-empty-panel" data-od-id="empty-state">
            <strong>No users</strong>
            <p>You do not have any IAM users in this account yet.</p>
            <p class="aws-desc" style="margin-top:12px"><a href="iam-users.html">View sample rows</a></p>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="../assets/console.js"></script>
</body>
</html>
