<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>awsbox console — design stub</title>
    <style>
      :root {
        --bg: #0f1419;
        --fg: #e7ecf1;
        --muted: #8b9aab;
        --accent: #ff9900;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Amazon Ember", "Segoe UI", system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
        display: grid;
        place-items: center;
        padding: 2rem;
      }
      main { max-width: 36rem; }
      h1 { font-weight: 600; letter-spacing: -0.02em; margin: 0 0 0.5rem; }
      p { color: var(--muted); line-height: 1.5; margin: 0; }
      .accent { color: var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <h1><span class="accent">awsbox</span> console</h1>
      <p>
        Design stub. Open Design writes console mocks into this folder
        (<code>design/awsbox-console</code>). Replace via OD runs — do not treat
        this page as the product UI.
      </p>
    </main>
  </body>
</html>
