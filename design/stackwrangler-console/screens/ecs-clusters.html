<!doctype html>
<html lang="en" data-asset-base="../assets">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clusters — Elastic Container Service</title>
  <link rel="stylesheet" href="../assets/fonts.css" />
  <link rel="stylesheet" href="../assets/console.css" />
</head>
<body data-page="ecs-clusters" data-nav="ecs-clusters" data-service="ecs" data-title="Clusters" data-crumb="Clusters">
  <div id="aws-chrome"></div>
  <div class="aws-shell" id="aws-shell" data-od-id="shell">
    <main class="aws-main" id="content" data-od-id="main-content">

      <h1 class="aws-h1" data-od-id="page-title">Clusters</h1>
      <p class="aws-desc">An Amazon ECS cluster is a logical grouping of tasks or services.</p>
      <section class="aws-card" data-od-id="content-card">
        <div class="aws-card-body">
          <div class="aws-toolbar" data-od-id="action-toolbar">
            <button type="button" class="btn-icon" aria-label="Refresh" title="To implement" disabled aria-disabled="true">↻</button>
            <button type="button" class="btn btn-normal" disabled aria-disabled="true" data-od-id="btn-delete-cluster" title="Select a row">Delete Cluster</button>
            <div class="spacer"></div>
            <a class="btn btn-primary" href="ecs-create-cluster.html" data-od-id="btn-create-cluster">Create Cluster</a>
          </div>
          <div class="aws-table-tools">
            <label class="aws-find"><span aria-hidden="true">⌕</span>
              <input type="search" placeholder="Filter clusters" data-find-table="#data-table" aria-label="Filter clusters" data-od-id="find-clusters" />
            </label>
            <div class="aws-pager" data-od-id="pagination">
              <button type="button" disabled aria-label="Previous">‹</button>
              <span class="page">1</span>
              <button type="button" disabled aria-label="Next">›</button>
              <button type="button" class="btn-icon" aria-label="Table settings" title="To implement" disabled aria-disabled="true">⚙</button>
            </div>
          </div>
          <div class="aws-table-wrap">
            <table class="aws-table" id="data-table" data-od-id="ecs-clusters-table">
              <thead>
                <tr>
                  <th class="check" scope="col"><input type="checkbox" aria-label="Select all" /></th>
                  <th scope="col"><span class="th-inner">Cluster name <span aria-hidden="true">↑</span></span></th>
                  <th scope="col"><span class="th-inner">Status <button type="button" class="filter" aria-label="Filter Status" title="To implement" disabled aria-disabled="true">▾</button></span></th>
                  <th scope="col"><span class="th-inner">Registered container instances <span aria-hidden="true">↑</span></span></th>
                  <th scope="col"><span class="th-inner">Services <span aria-hidden="true">↑</span></span></th>
                  <th scope="col"><span class="th-inner">Tasks running <span aria-hidden="true">↑</span></span></th>
                </tr>
              </thead>
              <tbody>
                <tr data-name="awsbox-lab">
                  <td class="check"><input type="checkbox" aria-label="Select awsbox-lab" /></td>
                  <td><a href="ecs-cluster-detail.html" data-od-id="cluster-awsbox-lab">awsbox-lab</a></td>
                  <td><span class="aws-status aws-status-success">ACTIVE</span></td>
                  <td>0</td>
                  <td>1</td>
                  <td>1</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="../assets/console.js"></script>
</body>
</html>
