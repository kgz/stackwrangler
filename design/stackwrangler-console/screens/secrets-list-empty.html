<!doctype html>
<html lang="en" data-asset-base="../assets">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Secrets — Secrets Manager</title>
  <link rel="stylesheet" href="../assets/fonts.css" />
  <link rel="stylesheet" href="../assets/console.css" />
</head>
<body data-page="secrets-list-empty" data-nav="secrets-list" data-service="secretsmanager" data-title="Secrets" data-crumb="Secrets">
  <div id="aws-chrome"></div>
  <div class="aws-shell" id="aws-shell" data-od-id="shell">
    <main class="aws-main" id="content" data-od-id="main-content">

      <h1 class="aws-h1" data-od-id="page-title">Secrets</h1>
      <p class="aws-desc">Secrets Manager helps you manage, retrieve, and rotate database credentials, application credentials, OAuth tokens, API keys, and other secrets throughout their lifecycles.</p>
      <section class="aws-card" data-od-id="content-card">
        <div class="aws-card-body">
          <div class="aws-toolbar" data-od-id="action-toolbar">
            <button type="button" class="btn-icon" aria-label="Refresh" title="To implement" disabled aria-disabled="true">↻</button>
            <div class="spacer"></div>
            <button type="button" class="btn btn-primary" disabled aria-disabled="true" data-od-id="btn-store-secret" title="To implement">Store a new secret</button>
          </div>
          <div class="aws-empty-panel" data-od-id="empty-state">
            <strong>No secrets</strong>
            <p>You do not have any secrets in this region.</p>
            <p class="aws-desc" style="margin-top:12px"><a href="secrets-list.html">View sample rows</a></p>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="../assets/console.js"></script>
</body>
</html>
