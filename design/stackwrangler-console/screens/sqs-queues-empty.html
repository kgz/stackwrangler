<!doctype html>
<html lang="en" data-asset-base="../assets">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Queues — SQS</title>
  <link rel="stylesheet" href="../assets/fonts.css" />
  <link rel="stylesheet" href="../assets/console.css" />
</head>
<body data-page="sqs-queues-empty" data-nav="sqs-queues" data-service="sqs" data-title="Queues" data-crumb="Queues">
  <div id="aws-chrome"></div>
  <div class="aws-shell" id="aws-shell" data-od-id="shell">
    <main class="aws-main" id="content" data-od-id="main-content">

      <h1 class="aws-h1" data-od-id="page-title">Queues</h1>
      <p class="aws-desc">Amazon Simple Queue Service (SQS) lets you send, store, and receive messages between software components at any volume, without losing messages or requiring other services to be available.</p>
      <section class="aws-card" data-od-id="content-card">
        <div class="aws-card-body">
          <div class="aws-toolbar" data-od-id="action-toolbar">
            <button type="button" class="btn-icon" aria-label="Refresh" title="Refresh" data-od-id="btn-refresh">↻</button>
            <div class="spacer"></div>
            <a class="btn btn-primary" href="sqs-create-queue.html" data-od-id="btn-create-queue">Create queue</a>
          </div>
          <div class="aws-empty-panel" data-od-id="empty-state">
            <strong>No queues</strong>
            <p>You do not have any queues in this region.</p>
            <p class="aws-desc" style="margin-top:12px"><a href="sqs-queues.html">View sample rows</a></p>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="../assets/console.js"></script>
