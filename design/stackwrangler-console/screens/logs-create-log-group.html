<!doctype html>
<html lang="en" data-asset-base="../assets">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create log group — CloudWatch</title>
  <link rel="stylesheet" href="../assets/fonts.css" />
  <link rel="stylesheet" href="../assets/console.css" />
</head>
<body data-page="logs-create-log-group" data-nav="logs-log-groups" data-service="logs" data-title="Create log group" data-crumb="Create log group">
  <div id="aws-chrome"></div>
  <div class="aws-shell" id="aws-shell" data-od-id="shell">
    <main class="aws-main" id="content" data-od-id="main-content">

      <h1 class="aws-h1" data-od-id="page-title">Create log group</h1>
      <p class="aws-desc">
        Create a log group. LocalEmu supports
        <code class="aws-mono">CreateLogGroup</code> and optional
        <code class="aws-mono">PutRetentionPolicy</code>.
      </p>

      <section class="aws-card" data-od-id="settings-card">
        <div class="aws-card-body aws-form-stack">
          <div class="aws-form-section">
            <h2 class="aws-section-title">Log group details</h2>
            <div class="aws-field">
              <label class="aws-label" for="lg-name">Log group name <span class="req" aria-hidden="true">*</span></label>
              <input class="aws-input" id="lg-name" name="logGroupName" type="text" autocomplete="off" placeholder="/aws/my-app/prod" value="/stackwrangler/demo" data-od-id="field-log-group-name" />
              <p class="aws-hint">1–512 characters. Letters, numbers, and the characters _ . / # -</p>
            </div>
            <div class="aws-field">
              <label class="aws-label" for="lg-retention">Retention setting</label>
              <select class="aws-select" id="lg-retention" name="retentionInDays" data-od-id="field-retention" style="max-width:480px;width:100%">
                <option value="" selected>Never expire</option>
                <option value="1">1 day</option>
                <option value="3">3 days</option>
                <option value="5">5 days</option>
                <option value="7">1 week</option>
                <option value="14">2 weeks</option>
                <option value="30">1 month</option>
                <option value="60">2 months</option>
                <option value="90">3 months</option>
                <option value="120">4 months</option>
                <option value="180">6 months</option>
                <option value="365">1 year</option>
                <option value="400">13 months</option>
                <option value="545">18 months</option>
                <option value="731">2 years</option>
                <option value="1827">5 years</option>
                <option value="3653">10 years</option>
              </select>
              <p class="aws-hint">Events older than the retention period are deleted automatically.</p>
            </div>
            <div class="aws-field">
              <label class="aws-label" for="lg-class">Log class</label>
              <select class="aws-select" id="lg-class" name="logGroupClass" disabled aria-disabled="true" title="To implement" data-od-id="field-log-class" style="max-width:480px;width:100%">
                <option value="STANDARD" selected>Standard</option>
                <option value="INFREQUENT_ACCESS">Infrequent Access</option>
              </select>
            </div>
          </div>
        </div>
      </section>

      <div class="aws-toolbar" style="margin-top:16px" data-od-id="form-actions">
        <a class="btn btn-normal" href="logs-log-groups.html" data-od-id="btn-cancel">Cancel</a>
        <button type="button" class="btn btn-primary" data-od-id="btn-create-submit">Create log group</button>
      </div>
    </main>
  </div>
  <script src="../assets/console.js"></script>
</body>
</html>
