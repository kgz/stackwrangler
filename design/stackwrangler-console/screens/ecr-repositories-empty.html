<!doctype html>
<html lang="en" data-asset-base="../assets">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Private repositories — Amazon ECR</title>
  <link rel="stylesheet" href="../assets/fonts.css" />
  <link rel="stylesheet" href="../assets/console.css" />
</head>
<body data-page="ecr-repositories-empty" data-nav="ecr-repositories" data-service="ecr" data-title="Private repositories" data-crumb="Private repositories">
  <div id="aws-chrome"></div>
  <div class="aws-shell" id="aws-shell" data-od-id="shell">
    <main class="aws-main" id="content" data-od-id="main-content">

      <h1 class="aws-h1" data-od-id="page-title">Private repositories</h1>
      <p class="aws-desc">Amazon Elastic Container Registry (ECR) stores, manages, and deploys container images. A repository holds the images for a single application or service.</p>
      <section class="aws-card" data-od-id="content-card">
        <div class="aws-card-body">
          <div class="aws-toolbar" data-od-id="action-toolbar">
            <button type="button" class="btn-icon" aria-label="Refresh" title="To implement" disabled aria-disabled="true">↻</button>
            <div class="spacer"></div>
            <button type="button" class="btn btn-primary" disabled aria-disabled="true" data-od-id="btn-create-repository" title="To implement">Create repository</button>
          </div>
          <div class="aws-empty-panel" data-od-id="empty-state">
            <strong>No private repositories</strong>
            <p>You do not have any private repositories in this region.</p>
            <p class="aws-desc" style="margin-top:12px"><a href="ecr-repositories.html">View sample rows</a></p>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="../assets/console.js"></script>
</body>
</html>
