<html lang="en" data-asset-base="../assets">

  <meta charset="utf-8" />

  <title>API call log — empty — Observability</title>
  <link rel="stylesheet" href="../assets/fonts.css" />

<body data-page="api-call-log-empty" data-nav="api-call-log" data-service="cloudtrail" data-title="API call log" data-crumb="API call log">

  <div class="aws-shell" id="aws-shell" data-od-id="shell">
    <main class="aws-main" id="content" data-od-id="main-content">
      <h1 class="aws-h1" data-od-id="page-title">API call log</h1>
      <p class="aws-desc">Local CloudTrail-lite: every AWS API call a workload made.</p>
      <section class="aws-card" data-od-id="content-card">

          <div class="aws-empty-panel" data-od-id="empty-calls">
            <strong>No API calls</strong>
            <p>Invoke a Lambda, run an ECS task, or use a CLI profile against LocalEmu to populate this log.</p>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="../assets/console.js"></script>
