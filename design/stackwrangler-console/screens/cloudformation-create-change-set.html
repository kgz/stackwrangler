<!doctype html>
<html lang="en" data-asset-base="../assets">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create change set — CloudFormation</title>
  <link rel="stylesheet" href="../assets/fonts.css" />
  <link rel="stylesheet" href="../assets/console.css" />
</head>
<body data-page="cloudformation-create-change-set" data-nav="cloudformation-stack-detail" data-service="cloudformation" data-title="Create change set" data-crumb="Create change set">
  <div id="aws-chrome"></div>
  <div class="aws-shell" id="aws-shell" data-od-id="shell">
    <main class="aws-main" id="content" data-od-id="main-content">

      <h1 class="aws-h1" data-od-id="page-title">Create change set</h1>
      <p class="aws-desc">Preview changes for <strong>awsbox-demo</strong> before executing.</p>

      <section class="aws-card" data-od-id="changeset-form">
        <div class="aws-card-body aws-form-stack">
          <div class="aws-form-section">
            <h2 class="aws-section-title">Change set details</h2>
            <div class="aws-field">
              <label class="aws-label" for="stack-name">Stack name</label>
              <input class="aws-input" id="stack-name" name="stackName" type="text" value="awsbox-demo" readonly data-od-id="field-stack-name" />
            </div>
            <div class="aws-field">
              <label class="aws-label" for="changeset-name">Change set name <span class="req" aria-hidden="true">*</span></label>
              <input class="aws-input" id="changeset-name" name="changeSetName" type="text" autocomplete="off" placeholder="my-change-set" value="demo-update-bucket" data-od-id="field-changeset-name" />
            </div>
            <div class="aws-field">
              <label class="aws-label" for="changeset-desc">Description</label>
              <input class="aws-input" id="changeset-desc" name="description" type="text" placeholder="Optional" value="Bump DemoBucket description" data-od-id="field-description" />
            </div>
          </div>

          <div class="aws-form-section" data-od-id="template-section">
            <h2 class="aws-section-title">Specify template</h2>
            <p class="aws-desc" style="margin-bottom:12px">Replace current template for this change set.</p>
            <div class="aws-field" data-od-id="template-body-field">
              <label class="aws-label" for="template-body">Template body <span class="req" aria-hidden="true">*</span></label>
              <textarea class="aws-input aws-mono" id="template-body" name="templateBody" rows="12" spellcheck="false" data-od-id="field-template-body" style="width:100%;min-height:220px;font-family:var(--awsbox-mono, ui-monospace, monospace);white-space:pre">AWSTemplateFormatVersion: '2010-09-09'
Description: Demo stack for local labs (changeset)
Resources:
  DemoBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: awsbox-demo-bucket</textarea>
            </div>
            <div class="aws-field" style="margin-top:12px">
              <label class="aws-label" for="template-file">Or upload a template file</label>
              <input class="aws-input" id="template-file" name="templateFile" type="file" accept=".yaml,.yml,.json,application/json,text/yaml" data-od-id="field-template-file" />
            </div>
          </div>

          <div class="aws-form-actions" data-od-id="create-actions">
            <a class="btn btn-normal" href="cloudformation-stack-detail.html" data-od-id="btn-cancel">Cancel</a>
            <button type="button" class="btn btn-primary" data-od-id="btn-create-changeset">Create change set</button>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="../assets/console.js"></script>
</body>
</html>
