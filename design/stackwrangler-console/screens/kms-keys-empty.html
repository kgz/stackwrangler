<!doctype html>
<html lang="en" data-asset-base="../assets">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Customer managed keys — Key Management Service</title>
  <link rel="stylesheet" href="../assets/fonts.css" />
  <link rel="stylesheet" href="../assets/console.css" />
</head>
<body data-page="kms-keys-empty" data-nav="kms-keys" data-service="kms" data-title="Customer managed keys" data-crumb="Customer managed keys">
  <div id="aws-chrome"></div>
  <div class="aws-shell" id="aws-shell" data-od-id="shell">
    <main class="aws-main" id="content" data-od-id="main-content">

      <h1 class="aws-h1" data-od-id="page-title">Customer managed keys</h1>
      <p class="aws-desc">Customer managed keys are KMS keys that you create, own, and manage. You control key policies, rotation, and when keys can be used for encrypt and decrypt operations.</p>
      <section class="aws-card" data-od-id="content-card">
        <div class="aws-card-body">
          <div class="aws-toolbar" data-od-id="action-toolbar">
            <button type="button" class="btn-icon" aria-label="Refresh" title="To implement" disabled aria-disabled="true">↻</button>
            <div class="spacer"></div>
            <button type="button" class="btn btn-primary" disabled aria-disabled="true" data-od-id="btn-create-key" title="To implement">Create key</button>
          </div>
          <div class="aws-empty-panel" data-od-id="empty-state">
            <strong>No customer managed keys</strong>
            <p>You do not have any customer managed keys in this region.</p>
            <p class="aws-desc" style="margin-top:12px"><a href="kms-keys.html">View sample rows</a></p>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="../assets/console.js"></script>
</body>
</html>
